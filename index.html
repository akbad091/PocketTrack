<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketTrack</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style type="text/tailwindcss">
      @import "tailwindcss";

      @theme {
        /* =========================
       COLORS
    ========================= */

        /* Primary */
        --color-primary: #6366f1;
        --color-primary-light: #818cf8;
        --color-primary-dark: #4f46e5;
        --color-primary-soft: #eef2ff;

        /* Backgrounds */
        --color-background: #f8fafc;
        --color-surface: #ffffff;
        --color-surface-secondary: #f1f5f9;

        /* Text */
        --color-heading: #172554;
        --color-text: #334155;
        --color-text-secondary: #64748b;
        --color-text-muted: #94a3b8;

        /* Borders */
        --color-border: #e2e8f0;
        --color-border-light: #f1f5f9;

        /* Status */
        --color-success: #16a34a;
        --color-success-light: #dcfce7;
        --color-danger: #dc2626;
        --color-danger-light: #fee2e2;
        --color-warning: #d97706;
        --color-warning-light: #fef3c7;

        /* Categories */
        --color-food: #f97316;
        --color-transport: #0ea5e9;
        --color-shopping: #a855f7;
        --color-entertainment: #ec4899;
        --color-other: #64748b;

        /* =========================
       FONTS
    ========================= */

        --font-inter: "Inter", sans-serif;
        --font-urbanist: "Urbanist", sans-serif;

        /* =========================
       BORDER RADIUS
    ========================= */

        --radius-card: 1rem;
        --radius-button: 0.75rem;
        --radius-input: 0.625rem;

        /* =========================
       SHADOWS
    ========================= */

        --shadow-card: 0 2px 8px rgb(15 23 42 / 0.04);
        --shadow-card-hover: 0 8px 24px rgb(15 23 42 / 0.08);

        /* =========================
       ANIMATIONS
    ========================= */

        --animate-fade-in: fade-in 0.3s ease-out;
        --animate-slide-up: slide-up 0.35s ease-out;
        --animate-pulse-soft: pulse-soft 2s ease-in-out infinite;

        @keyframes fade-in {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }

        @keyframes slide-up {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes pulse-soft {
          0%,
          100% {
            opacity: 1;
          }
          50% {
            opacity: 0.6;
          }
        }
      }
    </style>
  </head>
  <body>
    
  </body>
</html>
